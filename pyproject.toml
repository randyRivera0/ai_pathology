[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caip"
version = "0.1.0"
description = "Project description"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "randyRivera0" }]
dependencies = [
    "nicegui==3.17.1",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "fastapi==0.142.2",
    "aiofiles==25.1.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "ast-serialize==0.11.2",
    "attrs==26.1.0",
    "bidict==0.24.1",
    "certifi==2026.7.22",
    "cfgv==3.5.0",
    "click==8.5.0",
    "colorama==0.4.6",
    "distlib==0.4.3",
    "docutils==0.23",
    "filelock==4.0.7",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "identify==2.6.20",
    "idna==3.20",
    "ifaddr==0.2.0",
    "iniconfig==2.3.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "librt==0.16.0",
    "markdown2==2.5.5",
    "markupsafe==3.0.3",
    "multidict==6.9.1",
    "mypy==2.3.1",
    "mypy-extensions==1.1.0",
    "nodeenv==1.11.0",
    "opentelemetry-api==1.45.0",
    "orjson==3.12.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "platformdirs==4.12.2",
    "pluggy==1.6.0",
    "pre-commit==4.6.2",
    "propcache==0.5.4",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "python-discovery==1.6.1",
    "python-dotenv==1.2.3",
    "python-engineio==4.14.0",
    "python-multipart==0.0.32",
    "python-socketio==5.17.0",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
    "simple-websocket==1.1.0",
    "starlette==1.7.0",
    "tinycss2==1.5.1",
    "typing-inspection==0.4.4",
    "typing-extensions==4.16.0",
    "uvicorn==0.54.0",
    "virtualenv==21.14.1",
    "watchfiles==1.3.0",
    "webencodings==0.6.1",
    "websockets==17.1",
    "wsproto==1.3.2",
    "yarl==1.25.1",
    "pillow>=12.3.0",
    "keras>=3.15.1",
    "tensorflow>=2.21.0",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.13.1",
]

[project.scripts]
caipfrontend = "caipfrontend.__main__:main"
caipinference = "caipinference.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["frontend/src/caipfrontend", "inference/src/caipinference"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["keras.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest>=8",
    "ruff>=0.16.9",
]
