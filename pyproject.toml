[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caip"
version = "0.1.0"
description = "Project description"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "randyRivera0" }]
dependencies = ["nicegui", "httpx", "pydantic-settings"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy"]

[project.scripts]
caipfrontend = "caipfrontend.__main__:main"
caipinference = "caipinference.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["frontend/src/caipfrontend", "inference/src/caipinference"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["keras.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
